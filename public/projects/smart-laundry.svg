<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-laundry" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="50%" stop-color="#312e81"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="purple-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
    <pattern id="grid-laundry" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="rgba(129, 140, 248, 0.08)" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="100%" height="100%" fill="url(#bg-laundry)"/>
  <rect width="100%" height="100%" fill="url(#grid-laundry)"/>

  <circle cx="600" cy="180" r="150" fill="#a855f7" opacity="0.12" filter="blur(40px)"/>
  <circle cx="220" cy="280" r="150" fill="#6366f1" opacity="0.1" filter="blur(50px)"/>

  <!-- Mobile Mockups (2 Phones) -->
  <g transform="translate(320, 45)">
    <!-- Phone 1 (Back/Left) -->
    <g transform="translate(0, 20) rotate(-6)">
      <rect width="170" height="330" rx="28" fill="#0f172a" stroke="#818cf8" stroke-width="3"/>
      <!-- Notch -->
      <rect x="50" y="8" width="70" height="12" rx="6" fill="#020617"/>
      <!-- Screen elements -->
      <rect x="15" y="35" width="140" height="70" rx="12" fill="#4338ca"/>
      <text x="25" y="60" fill="#ffffff" font-size="11" font-weight="bold">Smart Wash</text>
      <text x="25" y="78" fill="#e0e7ff" font-size="9">Status: Sedang Dicuci (35m)</text>
      <circle cx="120" cy="70" r="16" fill="rgba(255,255,255,0.2)"/>

      <rect x="15" y="115" width="140" height="40" rx="8" fill="#1e1b4b"/>
      <rect x="15" y="165" width="140" height="40" rx="8" fill="#1e1b4b"/>
      <rect x="15" y="215" width="140" height="40" rx="8" fill="#1e1b4b"/>
    </g>

    <!-- Phone 2 (Front/Right) -->
    <g transform="translate(140, 10) rotate(4)">
      <rect width="175" height="340" rx="28" fill="#0f172a" stroke="#c084fc" stroke-width="3" filter="drop-shadow(0 20px 30px rgba(0,0,0,0.8))"/>
      <rect x="52" y="8" width="70" height="12" rx="6" fill="#020617"/>
      <!-- Content -->
      <text x="20" y="45" fill="#f8fafc" font-size="12" font-weight="bold">Tracking Order #SL-89</text>
      <!-- Stepper tracker -->
      <circle cx="30" cy="75" r="7" fill="#10b981"/>
      <line x1="30" y1="82" x2="30" y2="115" stroke="#10b981" stroke-width="2"/>
      <circle cx="30" cy="122" r="7" fill="#10b981"/>
      <line x1="30" y1="129" x2="30" y2="162" stroke="#818cf8" stroke-width="2"/>
      <circle cx="30" cy="169" r="7" fill="#818cf8"/>
      <line x1="30" y1="176" x2="30" y2="209" stroke="#475569" stroke-width="2"/>
      <circle cx="30" cy="216" r="7" fill="#475569"/>

      <text x="48" y="79" fill="#e2e8f0" font-size="10">Kurir Mengambil Pakaian</text>
      <text x="48" y="126" fill="#e2e8f0" font-size="10">Pencucian &amp; Pengeringan</text>
      <text x="48" y="173" fill="#a5b4fc" font-size="10" font-weight="bold">Setrika Uap &amp; Quality Check</text>
      <text x="48" y="220" fill="#94a3b8" font-size="10">Siap Dikirim Kembali</text>

      <!-- Pay button -->
      <rect x="15" y="270" width="145" height="38" rx="10" fill="url(#purple-glow)"/>
      <text x="87" y="294" fill="#0f172a" font-size="11" font-weight="bold" text-anchor="middle">Konfirmasi Selesai</text>
    </g>
  </g>

  <!-- Left Floating Badge -->
  <g transform="translate(60, 140)">
    <rect width="200" height="160" rx="16" fill="#090514" stroke="#818cf8" stroke-width="2" opacity="0.95" filter="drop-shadow(0 15px 25px rgba(0,0,0,0.8))"/>
    <!-- Washing icon -->
    <circle cx="100" cy="55" r="22" fill="none" stroke="#a78bfa" stroke-width="4"/>
    <circle cx="100" cy="55" r="10" fill="#818cf8"/>
    <text x="100" y="105" fill="#ffffff" font-size="14" font-weight="bold" font-family="sans-serif" text-anchor="middle">SMART LAUNDRY</text>
    <text x="100" y="125" fill="#a78bfa" font-size="11" font-family="monospace" text-anchor="middle">FIGMA UI/UX &bull; 2025</text>
    <rect x="45" y="135" width="110" height="4" rx="2" fill="url(#purple-glow)"/>
  </g>
</svg>

