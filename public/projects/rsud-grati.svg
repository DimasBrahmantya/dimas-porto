<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grati" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#022c22"/>
      <stop offset="50%" stop-color="#064e3b"/>
      <stop offset="100%" stop-color="#021f18"/>
    </linearGradient>
    <linearGradient id="emerald-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#14b8a6"/>
    </linearGradient>
    <pattern id="grid-grati" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="rgba(16, 185, 129, 0.08)" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="100%" height="100%" fill="url(#bg-grati)"/>
  <rect width="100%" height="100%" fill="url(#grid-grati)"/>

  <circle cx="620" cy="180" r="140" fill="#10b981" opacity="0.12" filter="blur(40px)"/>
  <circle cx="200" cy="280" r="160" fill="#06b6d4" opacity="0.1" filter="blur(50px)"/>

  <!-- Portal Mockup -->
  <g transform="translate(180, 70)">
    <rect width="520" height="310" rx="16" fill="#031a14" stroke="rgba(16, 185, 129, 0.3)" stroke-width="2"/>
    <rect width="520" height="38" rx="16" fill="#062e24"/>
    <circle cx="24" cy="19" r="5" fill="#ef4444"/>
    <circle cx="42" cy="19" r="5" fill="#f59e0b"/>
    <circle cx="60" cy="19" r="5" fill="#10b981"/>
    <text x="260" y="24" fill="#a7f3d0" font-size="11" font-family="monospace" text-anchor="middle">rsud-grati.pasuruankab.go.id/rawat-jalan</text>

    <!-- Registration Form Mockup -->
    <g transform="translate(40, 60)">
      <text x="0" y="20" fill="#ffffff" font-size="16" font-weight="bold" font-family="sans-serif">Pendaftaran Pasien Poliklinik RSUD Grati</text>
      <text x="0" y="38" fill="#6ee7b7" font-size="11" font-family="sans-serif">Pelayanan cepat &amp; terintegrasi dengan database rekam medis</text>

      <rect x="0" y="55" width="210" height="36" rx="6" fill="#083327" stroke="rgba(16, 185, 129, 0.4)"/>
      <text x="12" y="78" fill="#a7f3d0" font-size="11">Nomor RM / NIK KTP</text>

      <rect x="230" y="55" width="210" height="36" rx="6" fill="#083327" stroke="rgba(16, 185, 129, 0.4)"/>
      <text x="242" y="78" fill="#a7f3d0" font-size="11">Pilih Poli (Poli Umum, Mata, Gigi)</text>

      <rect x="0" y="105" width="440" height="70" rx="8" fill="#05251c" stroke="rgba(16, 185, 129, 0.2)"/>
      <text x="15" y="130" fill="#ffffff" font-size="11" font-weight="bold">Antrean Langsung (Live Display):</text>
      <text x="15" y="152" fill="#34d399" font-family="monospace" font-size="18" font-weight="bold">POLI DALAM: #A-024  |  POLI ANAK: #B-012</text>

      <rect x="0" y="190" width="160" height="34" rx="6" fill="#10b981"/>
      <text x="80" y="212" fill="#022c22" font-size="12" font-weight="bold" text-anchor="middle" font-family="sans-serif">Cetak Tiket Antrean</text>
    </g>
  </g>

  <!-- Left Floating Badge -->
  <g transform="translate(60, 140)">
    <rect width="180" height="160" rx="16" fill="#021913" stroke="#10b981" stroke-width="2" opacity="0.95" filter="drop-shadow(0 15px 25px rgba(0,0,0,0.8))"/>
    <path d="M 90 35 L 115 55 L 65 55 Z M 70 55 L 110 55 L 110 90 L 70 90 Z M 85 70 L 95 70 L 95 90 L 85 90 Z" fill="#34d399"/>
    <text x="90" y="118" fill="#ffffff" font-size="14" font-weight="bold" font-family="sans-serif" text-anchor="middle">RSUD GRATI</text>
    <text x="90" y="136" fill="#10b981" font-size="10" font-family="monospace" text-anchor="middle">INTERNSHIP 2025</text>
    <rect x="35" y="146" width="110" height="4" rx="2" fill="url(#emerald-glow)"/>
  </g>
</svg>

