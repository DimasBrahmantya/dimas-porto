<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-loyalty" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="40%" stop-color="#14101e"/>
      <stop offset="100%" stop-color="#070a12"/>
    </linearGradient>
    <linearGradient id="amber-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#eab308"/>
    </linearGradient>
    <linearGradient id="card-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e130c"/>
      <stop offset="100%" stop-color="#0f0b07"/>
    </linearGradient>
    <linearGradient id="stamp-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>
    <pattern id="grid-loyalty" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M 28 0 L 0 0 0 28" fill="none" stroke="rgba(249, 115, 22, 0.07)" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Canvas Background -->
  <rect width="100%" height="100%" fill="url(#bg-loyalty)"/>
  <rect width="100%" height="100%" fill="url(#grid-loyalty)"/>

  <!-- Atmospheric Glow Orbs -->
  <circle cx="640" cy="140" r="150" fill="#f97316" opacity="0.12" filter="blur(50px)"/>
  <circle cx="160" cy="300" r="160" fill="#06b6d4" opacity="0.10" filter="blur(50px)"/>

  <!-- MAIN WINDOW FRAME -->
  <g transform="translate(40, 35)">
    <!-- Container -->
    <rect width="720" height="380" rx="16" fill="#0c111d" stroke="rgba(249, 115, 22, 0.25)" stroke-width="1.5"/>
    
    <!-- Header Bar -->
    <rect width="720" height="36" rx="16" fill="#111827"/>
    <circle cx="20" cy="18" r="5" fill="#ef4444"/>
    <circle cx="36" cy="18" r="5" fill="#f59e0b"/>
    <circle cx="52" cy="18" r="5" fill="#10b981"/>
    <rect x="230" y="7" width="260" height="22" rx="6" fill="#080d16" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
    <text x="360" y="22" fill="#94a3b8" font-size="10.5" font-family="monospace" text-anchor="middle">loyaltycard-sable.vercel.app</text>

    <!-- LEFT COLUMN: CASHIER WEB SCANNER -->
    <g transform="translate(30, 60)">
      <text x="0" y="14" fill="#f97316" font-size="12" font-family="monospace" font-weight="bold">⚡ KASIR QR AUTO-STAMP</text>
      <text x="0" y="30" fill="#94a3b8" font-size="9.5" font-family="sans-serif">Kamera web mendeteksi QR &amp; stempel otomatis via RPC</text>

      <!-- Camera Viewport Box -->
      <g transform="translate(0, 42)">
        <rect width="310" height="185" rx="12" fill="#070a12" stroke="rgba(6, 182, 212, 0.35)" stroke-width="1.5"/>
        
        <!-- Scan Target Reticle -->
        <rect x="75" y="20" width="160" height="145" rx="10" fill="none" stroke="#22d3ee" stroke-width="2" stroke-dasharray="8 6"/>
        <path d="M 75 40 L 75 20 L 95 20" stroke="#06b6d4" stroke-width="3" fill="none"/>
        <path d="M 215 20 L 235 20 L 235 40" stroke="#06b6d4" stroke-width="3" fill="none"/>
        <path d="M 75 145 L 75 165 L 95 165" stroke="#06b6d4" stroke-width="3" fill="none"/>
        <path d="M 215 165 L 235 165 L 235 145" stroke="#06b6d4" stroke-width="3" fill="none"/>

        <!-- Mini QR Code Representation -->
        <g transform="translate(110, 48)">
          <rect width="90" height="90" fill="#ffffff" rx="4"/>
          <!-- QR corners -->
          <rect x="8" y="8" width="22" height="22" fill="#000000"/>
          <rect x="12" y="12" width="14" height="14" fill="#ffffff"/>
          <rect x="15" y="15" width="8" height="8" fill="#000000"/>

          <rect x="60" y="8" width="22" height="22" fill="#000000"/>
          <rect x="64" y="12" width="14" height="14" fill="#ffffff"/>
          <rect x="67" y="15" width="8" height="8" fill="#000000"/>

          <rect x="8" y="60" width="22" height="22" fill="#000000"/>
          <rect x="12" y="64" width="14" height="14" fill="#ffffff"/>
          <rect x="15" y="67" width="8" height="8" fill="#000000"/>

          <!-- QR Dots -->
          <rect x="36" y="12" width="6" height="6" fill="#000000"/>
          <rect x="46" y="22" width="6" height="6" fill="#000000"/>
          <rect x="36" y="38" width="8" height="8" fill="#000000"/>
          <rect x="48" y="44" width="6" height="6" fill="#000000"/>
          <rect x="62" y="40" width="6" height="6" fill="#000000"/>
          <rect x="36" y="66" width="6" height="6" fill="#000000"/>
          <rect x="52" y="68" width="8" height="8" fill="#000000"/>
          <rect x="68" y="64" width="6" height="6" fill="#000000"/>
        </g>

        <!-- Scanning Beam Line -->
        <line x1="80" y1="92" x2="230" y2="92" stroke="#22d3ee" stroke-width="2" opacity="0.85"/>
      </g>

      <!-- Success Notification Pill -->
      <g transform="translate(0, 238)">
        <rect width="310" height="34" rx="8" fill="rgba(16, 185, 129, 0.12)" stroke="#10b981" stroke-width="1"/>
        <circle cx="20" cy="17" r="7" fill="#10b981"/>
        <text x="20" y="20.5" fill="#ffffff" font-size="9" font-family="monospace" font-weight="bold" text-anchor="middle">✓</text>
        <text x="35" y="21" fill="#34d399" font-size="10.5" font-family="monospace" font-weight="bold">+1 STEMPEL BERHASIL (Auto-Chime 🔔)</text>
      </g>
    </g>

    <!-- RIGHT COLUMN: DIGITAL LOYALTY CARD (/c/[token]) -->
    <g transform="translate(370, 60)">
      <text x="0" y="14" fill="#38bdf8" font-size="12" font-family="monospace" font-weight="bold">📱 TAMPILAN KARTU PELANGGAN</text>
      <text x="0" y="30" fill="#94a3b8" font-size="9.5" font-family="sans-serif">Tanpa Login • Akses Instan via URL Token 192-bit</text>

      <!-- Digital Loyalty Card Container -->
      <g transform="translate(0, 42)">
        <rect width="320" height="230" rx="14" fill="url(#card-grad)" stroke="#f97316" stroke-width="1.5" filter="drop-shadow(0 4px 15px rgba(249,115,22,0.25))"/>
        
        <!-- Store Brand Bar -->
        <g transform="translate(18, 16)">
          <rect width="28" height="28" rx="7" fill="#ea580c"/>
          <text x="14" y="19" fill="#ffffff" font-size="14" font-weight="bold" font-family="sans-serif" text-anchor="middle">☕</text>
          <text x="38" y="14" fill="#ffffff" font-size="12" font-family="sans-serif" font-weight="bold">Kopi Nusantara</text>
          <text x="38" y="26" fill="#f97316" font-size="9" font-family="monospace">Tenant ID: kpn-malang</text>
        </g>

        <!-- Progress Counter -->
        <g transform="translate(230, 20)">
          <rect width="72" height="22" rx="11" fill="rgba(249, 115, 22, 0.2)" stroke="#f97316" stroke-width="1"/>
          <text x="36" y="15" fill="#fdba74" font-size="10" font-family="monospace" font-weight="bold" text-anchor="middle">8 / 10 STAMP</text>
        </g>

        <!-- Stamp Grid (2 rows x 5 stamps) -->
        <g transform="translate(18, 62)">
          <!-- Row 1 -->
          <!-- Stamp 1 -->
          <circle cx="20" cy="20" r="16" fill="url(#stamp-gold)" stroke="#fbbf24" stroke-width="1"/>
          <text x="20" y="24" fill="#ffffff" font-size="11" text-anchor="middle">☕</text>
          <!-- Stamp 2 -->
          <circle cx="78" cy="20" r="16" fill="url(#stamp-gold)" stroke="#fbbf24" stroke-width="1"/>
          <text x="78" y="24" fill="#ffffff" font-size="11" text-anchor="middle">☕</text>
          <!-- Stamp 3 -->
          <circle cx="136" cy="20" r="16" fill="url(#stamp-gold)" stroke="#fbbf24" stroke-width="1"/>
          <text x="136" y="24" fill="#ffffff" font-size="11" text-anchor="middle">☕</text>
          <!-- Stamp 4 -->
          <circle cx="194" cy="20" r="16" fill="url(#stamp-gold)" stroke="#fbbf24" stroke-width="1"/>
          <text x="194" y="24" fill="#ffffff" font-size="11" text-anchor="middle">☕</text>
          <!-- Stamp 5 -->
          <circle cx="252" cy="20" r="16" fill="url(#stamp-gold)" stroke="#fbbf24" stroke-width="1"/>
          <text x="252" y="24" fill="#ffffff" font-size="11" text-anchor="middle">☕</text>

          <!-- Row 2 -->
          <!-- Stamp 6 -->
          <circle cx="20" cy="62" r="16" fill="url(#stamp-gold)" stroke="#fbbf24" stroke-width="1"/>
          <text x="20" y="66" fill="#ffffff" font-size="11" text-anchor="middle">☕</text>
          <!-- Stamp 7 -->
          <circle cx="78" cy="62" r="16" fill="url(#stamp-gold)" stroke="#fbbf24" stroke-width="1"/>
          <text x="78" y="66" fill="#ffffff" font-size="11" text-anchor="middle">☕</text>
          <!-- Stamp 8 -->
          <circle cx="136" cy="62" r="16" fill="url(#stamp-gold)" stroke="#fbbf24" stroke-width="1"/>
          <text x="136" y="66" fill="#ffffff" font-size="11" text-anchor="middle">☕</text>
          <!-- Stamp 9 (Empty) -->
          <circle cx="194" cy="62" r="16" fill="#1a1412" stroke="rgba(249, 115, 22, 0.4)" stroke-width="1" stroke-dasharray="3 3"/>
          <text x="194" y="66" fill="#78716c" font-size="10" font-family="monospace" text-anchor="middle">9</text>
          <!-- Stamp 10 (Reward Target) -->
          <circle cx="252" cy="62" r="16" fill="#2d1608" stroke="#f97316" stroke-width="1.5"/>
          <text x="252" y="66" fill="#f97316" font-size="12" text-anchor="middle">🎁</text>
        </g>

        <!-- Reward Banner Lockup -->
        <g transform="translate(18, 164)">
          <rect width="284" height="48" rx="8" fill="#130e0b" stroke="rgba(249, 115, 22, 0.3)" stroke-width="1"/>
          <text x="14" y="20" fill="#fb923c" font-size="10.5" font-family="sans-serif" font-weight="bold">🎉 Hadiah: Gratis 1 Es Kopi Susu</text>
          <text x="14" y="36" fill="#a8a29e" font-size="9" font-family="sans-serif">Kumpulkan 2 stempel lagi untuk menukarkan hadiah di kasir.</text>
        </g>
      </g>
    </g>

    <!-- FOOTER TECH STACK BAR -->
    <g transform="translate(30, 335)">
      <rect width="660" height="28" rx="6" fill="#080c14" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
      <text x="16" y="18" fill="#94a3b8" font-size="9.5" font-family="monospace">
        TECH: Next.js App Router • Supabase RLS • PostgreSQL RPC • TypeScript Strict • Tailwind CSS • PGlite Test
      </text>
    </g>
  </g>
</svg>

