<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-banana" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#451a03"/>
      <stop offset="50%" stop-color="#78350f"/>
      <stop offset="100%" stop-color="#1c1917"/>
    </linearGradient>
    <linearGradient id="amber-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>
    <pattern id="grid-banana" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="rgba(245, 158, 11, 0.08)" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="100%" height="100%" fill="url(#bg-banana)"/>
  <rect width="100%" height="100%" fill="url(#grid-banana)"/>

  <circle cx="600" cy="180" r="160" fill="#f59e0b" opacity="0.12" filter="blur(40px)"/>

  <!-- Mobile Mockup -->
  <g transform="translate(360, 50)">
    <rect width="190" height="350" rx="28" fill="#1c1917" stroke="#f59e0b" stroke-width="3" filter="drop-shadow(0 20px 30px rgba(0,0,0,0.8))"/>
    <rect x="60" y="8" width="70" height="12" rx="6" fill="#0c0a09"/>
    
    <!-- Mobile App Header -->
    <text x="20" y="45" fill="#fef3c7" font-size="12" font-weight="bold">Oleh-Oleh Khas</text>
    <rect x="15" y="60" width="160" height="90" rx="10" fill="#292524" stroke="rgba(245, 158, 11, 0.3)"/>
    <!-- Banana craft visual -->
    <path d="M 50 115 Q 95 85, 140 100 Q 95 125, 50 115 Z" fill="#fbbf24"/>
    <text x="25" y="85" fill="#fef3c7" font-size="11" font-weight="bold">Sale Pisang Crispy</text>
    <text x="25" y="100" fill="#f59e0b" font-size="10">Khas Banyuwangi &bull; 250gr</text>

    <!-- Product list -->
    <rect x="15" y="160" width="160" height="50" rx="8" fill="#292524"/>
    <rect x="25" y="168" width="34" height="34" rx="6" fill="#78350f"/>
    <text x="68" y="184" fill="#fef3c7" font-size="10" font-weight="bold">Sale Basah Manis</text>
    <text x="68" y="198" fill="#fbbf24" font-size="10">Rp 22.000</text>

    <rect x="15" y="218" width="160" height="50" rx="8" fill="#292524"/>
    <rect x="25" y="226" width="34" height="34" rx="6" fill="#78350f"/>
    <text x="68" y="242" fill="#fef3c7" font-size="10" font-weight="bold">Kripik Pisang Coklat</text>
    <text x="68" y="256" fill="#fbbf24" font-size="10">Rp 18.000</text>

    <!-- Bottom Nav -->
    <rect x="15" y="285" width="160" height="38" rx="10" fill="url(#amber-glow)"/>
    <text x="95" y="309" fill="#1c1917" font-size="12" font-weight="bold" text-anchor="middle">Beli Sekarang (Keranjang)</text>
  </g>

  <!-- Left Floating Badge -->
  <g transform="translate(60, 140)">
    <rect width="200" height="160" rx="16" fill="#1c1917" stroke="#f59e0b" stroke-width="2" opacity="0.95" filter="drop-shadow(0 15px 25px rgba(0,0,0,0.8))"/>
    <circle cx="100" cy="55" r="22" fill="none" stroke="#f59e0b" stroke-width="3"/>
    <path d="M 88 55 Q 100 45, 112 55" stroke="#fbbf24" stroke-width="4" fill="none" stroke-linecap="round"/>
    <text x="100" y="105" fill="#ffffff" font-size="14" font-weight="bold" font-family="sans-serif" text-anchor="middle">SALE PISANG</text>
    <text x="100" y="125" fill="#fbbf24" font-size="11" font-family="monospace" text-anchor="middle">UI/UX DESIGN &bull; 2024</text>
    <rect x="45" y="135" width="110" height="4" rx="2" fill="url(#amber-glow)"/>
  </g>
</svg>

