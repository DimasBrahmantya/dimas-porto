<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-dimas" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050b14"/>
      <stop offset="50%" stop-color="#0e274a"/>
      <stop offset="100%" stop-color="#030813"/>
    </linearGradient>
    <linearGradient id="cyan-electric" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <pattern id="grid-dimas" width="25" height="25" patternUnits="userSpaceOnUse">
      <path d="M 25 0 L 0 0 0 25" fill="none" stroke="rgba(34, 211, 238, 0.08)" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="100%" height="100%" fill="url(#bg-dimas)"/>
  <rect width="100%" height="100%" fill="url(#grid-dimas)"/>

  <circle cx="620" cy="180" r="160" fill="#06b6d4" opacity="0.15" filter="blur(50px)"/>
  <circle cx="180" cy="280" r="150" fill="#3b82f6" opacity="0.1" filter="blur(50px)"/>

  <!-- Futuristic Portfolio Interface -->
  <g transform="translate(180, 70)">
    <rect width="520" height="310" rx="16" fill="#060e1a" stroke="rgba(34, 211, 238, 0.35)" stroke-width="2"/>
    <rect width="520" height="38" rx="16" fill="#0b1a2f"/>
    <circle cx="24" cy="19" r="5" fill="#ef4444"/>
    <circle cx="42" cy="19" r="5" fill="#f59e0b"/>
    <circle cx="60" cy="19" r="5" fill="#10b981"/>
    <text x="260" y="24" fill="#a5f3fc" font-size="11" font-family="monospace" text-anchor="middle">dimas-portfolio-smoky.vercel.app</text>

    <!-- Content Screen -->
    <g transform="translate(35, 55)">
      <text x="0" y="25" fill="#22d3ee" font-size="11" font-family="monospace">■ SYSTEM ACTIVE &bull; PROFILE ARCHIVE</text>
      <text x="0" y="65" fill="#ffffff" font-size="34" font-weight="900" font-family="sans-serif">PORTFOLIO 2026</text>
      <text x="0" y="90" fill="#94a3b8" font-size="12" font-family="sans-serif">Dimas Brahmantya Aryasena &bull; Full-Stack &amp; Front-End Developer</text>

      <!-- Pill Nav simulation -->
      <g transform="translate(0, 110)">
        <rect width="260" height="36" rx="18" fill="#081220" stroke="rgba(34, 211, 238, 0.3)"/>
        <rect x="4" y="4" width="70" height="28" rx="14" fill="#ffffff"/>
        <text x="39" y="22" fill="#000000" font-size="9" font-weight="bold" text-anchor="middle">PROFIL</text>
        <text x="125" y="22" fill="#94a3b8" font-size="9" font-weight="bold" text-anchor="middle">PROJECT</text>
        <text x="205" y="22" fill="#94a3b8" font-size="9" font-weight="bold" text-anchor="middle">CONTACT</text>
      </g>

      <!-- Stat boxes -->
      <g transform="translate(0, 160)">
        <rect x="0" y="0" width="135" height="50" rx="8" fill="#0c1e36" stroke="rgba(34, 211, 238, 0.2)"/>
        <text x="12" y="20" fill="#94a3b8" font-size="9">IPK UMM</text>
        <text x="12" y="40" fill="#22d3ee" font-size="18" font-weight="bold">3.80</text>

        <rect x="150" y="0" width="135" height="50" rx="8" fill="#0c1e36" stroke="rgba(34, 211, 238, 0.2)"/>
        <text x="162" y="20" fill="#94a3b8" font-size="9">Total Projects</text>
        <text x="162" y="40" fill="#38bdf8" font-size="18" font-weight="bold">9+ Karya</text>

        <rect x="300" y="0" width="145" height="50" rx="8" fill="#0c1e36" stroke="rgba(34, 211, 238, 0.2)"/>
        <text x="312" y="20" fill="#94a3b8" font-size="9">Tech Stack</text>
        <text x="312" y="40" fill="#34d399" font-size="14" font-weight="bold">Next.js / TS</text>
      </g>
    </g>
  </g>

  <!-- Left Floating Badge -->
  <g transform="translate(60, 140)">
    <rect width="180" height="160" rx="16" fill="#030712" stroke="#22d3ee" stroke-width="2" opacity="0.95" filter="drop-shadow(0 15px 25px rgba(0,0,0,0.8))"/>
    <rect x="65" y="35" width="50" height="50" rx="12" fill="#081220" stroke="#22d3ee" stroke-width="2"/>
    <text x="90" y="68" fill="#22d3ee" font-size="20" font-weight="bold" font-family="monospace" text-anchor="middle">DB</text>
    <text x="90" y="112" fill="#ffffff" font-size="14" font-weight="bold" font-family="sans-serif" text-anchor="middle">PORTFOLIO DB</text>
    <text x="90" y="130" fill="#22d3ee" font-size="10" font-family="monospace" text-anchor="middle">NEO-BRUTALISM</text>
    <rect x="35" y="140" width="110" height="4" rx="2" fill="url(#cyan-electric)"/>
  </g>
</svg>

