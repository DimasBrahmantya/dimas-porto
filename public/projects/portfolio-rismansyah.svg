<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-risman" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="indigo-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <pattern id="grid-risman" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="rgba(99, 102, 241, 0.08)" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="100%" height="100%" fill="url(#bg-risman)"/>
  <rect width="100%" height="100%" fill="url(#grid-risman)"/>

  <circle cx="580" cy="180" r="150" fill="#6366f1" opacity="0.1" filter="blur(40px)"/>

  <!-- Browser Window Mockup -->
  <g transform="translate(180, 70)">
    <rect width="520" height="310" rx="16" fill="#0f172a" stroke="rgba(99, 102, 241, 0.3)" stroke-width="2"/>
    <rect width="520" height="38" rx="16" fill="#1e293b"/>
    <circle cx="24" cy="19" r="5" fill="#ef4444"/>
    <circle cx="42" cy="19" r="5" fill="#f59e0b"/>
    <circle cx="60" cy="19" r="5" fill="#10b981"/>
    <text x="260" y="24" fill="#cbd5e1" font-size="11" font-family="monospace" text-anchor="middle">rismansyah-portofolio.vercel.app</text>

    <!-- Content -->
    <g transform="translate(40, 60)">
      <text x="0" y="25" fill="#a5b4fc" font-size="12" font-family="monospace">SOFTWARE ENGINEER &bull; SHOWCASE</text>
      <text x="0" y="60" fill="#ffffff" font-size="28" font-weight="900" font-family="sans-serif">RISMANSYAH</text>
      <text x="0" y="85" fill="#94a3b8" font-size="12" font-family="sans-serif">Custom built portfolio with responsive grid, project case studies, and seamless animation.</text>

      <!-- Projects preview grid -->
      <g transform="translate(0, 110)">
        <rect x="0" y="0" width="135" height="100" rx="8" fill="#1e293b" stroke="rgba(99, 102, 241, 0.2)"/>
        <text x="12" y="30" fill="#a5b4fc" font-size="10" font-weight="bold">Case Study #01</text>
        <text x="12" y="50" fill="#ffffff" font-size="11" font-weight="bold">Cloud Storage</text>

        <rect x="150" y="0" width="135" height="100" rx="8" fill="#1e293b" stroke="rgba(99, 102, 241, 0.2)"/>
        <text x="162" y="30" fill="#a5b4fc" font-size="10" font-weight="bold">Case Study #02</text>
        <text x="162" y="50" fill="#ffffff" font-size="11" font-weight="bold">Dev Platform</text>

        <rect x="300" y="0" width="135" height="100" rx="8" fill="#1e293b" stroke="rgba(99, 102, 241, 0.2)"/>
        <text x="312" y="30" fill="#a5b4fc" font-size="10" font-weight="bold">Case Study #03</text>
        <text x="312" y="50" fill="#ffffff" font-size="11" font-weight="bold">Mobile App</text>
      </g>
    </g>
  </g>

  <!-- Left Floating Badge -->
  <g transform="translate(60, 140)">
    <rect width="180" height="160" rx="16" fill="#020617" stroke="#6366f1" stroke-width="2" opacity="0.95" filter="drop-shadow(0 15px 25px rgba(0,0,0,0.8))"/>
    <circle cx="90" cy="55" r="22" fill="rgba(99, 102, 241, 0.2)" stroke="#6366f1" stroke-width="3"/>
    <text x="90" y="62" fill="#a5b4fc" font-size="16" font-weight="bold" font-family="sans-serif" text-anchor="middle">R</text>
    <text x="90" y="108" fill="#ffffff" font-size="13" font-weight="bold" font-family="sans-serif" text-anchor="middle">RISMANSYAH</text>
    <text x="90" y="126" fill="#a5b4fc" font-size="10" font-family="monospace" text-anchor="middle">PORTFOLIO &bull; 2026</text>
    <rect x="35" y="136" width="110" height="4" rx="2" fill="url(#indigo-glow)"/>
  </g>
</svg>

