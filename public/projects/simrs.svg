<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a192f"/>
      <stop offset="50%" stop-color="#0f2b48"/>
      <stop offset="100%" stop-color="#051020"/>
    </linearGradient>
    <linearGradient id="cyan-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="rgba(6, 182, 212, 0.08)" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="100%" height="100%" fill="url(#bg)"/>
  <rect width="100%" height="100%" fill="url(#grid)"/>

  <!-- Hospital Cross & Glowing Orb -->
  <circle cx="620" cy="160" r="140" fill="#06b6d4" opacity="0.12" filter="blur(40px)"/>
  <circle cx="200" cy="300" r="180" fill="#3b82f6" opacity="0.08" filter="blur(50px)"/>

  <!-- Dashboard Mockup Window -->
  <g transform="translate(180, 70)">
    <rect width="520" height="310" rx="16" fill="#071322" stroke="rgba(6, 182, 212, 0.3)" stroke-width="2"/>
    <!-- Window Header -->
    <rect width="520" height="38" rx="16" fill="#0b1e36"/>
    <circle cx="24" cy="19" r="5" fill="#ef4444"/>
    <circle cx="42" cy="19" r="5" fill="#f59e0b"/>
    <circle cx="60" cy="19" r="5" fill="#10b981"/>
    <text x="260" y="24" fill="#94a3b8" font-size="11" font-family="monospace" text-anchor="middle">simrs-rawat-jalan.local/dashboard</text>

    <!-- Sidebar -->
    <rect x="0" y="38" width="120" height="272" fill="#06111f" opacity="0.8"/>
    <rect x="15" y="60" width="90" height="18" rx="4" fill="rgba(6, 182, 212, 0.25)"/>
    <rect x="15" y="90" width="75" height="12" rx="4" fill="#1e293b"/>
    <rect x="15" y="112" width="85" height="12" rx="4" fill="#1e293b"/>
    <rect x="15" y="134" width="70" height="12" rx="4" fill="#1e293b"/>

    <!-- Main Content: Stats Cards -->
    <g transform="translate(140, 55)">
      <rect x="0" y="0" width="110" height="60" rx="8" fill="#0f243e" stroke="rgba(6, 182, 212, 0.2)"/>
      <text x="14" y="22" fill="#94a3b8" font-size="9" font-family="sans-serif">Antrean Hari Ini</text>
      <text x="14" y="48" fill="#38bdf8" font-size="20" font-weight="bold" font-family="sans-serif">142</text>

      <rect x="125" y="0" width="110" height="60" rx="8" fill="#0f243e" stroke="rgba(6, 182, 212, 0.2)"/>
      <text x="139" y="22" fill="#94a3b8" font-size="9" font-family="sans-serif">Dokter Aktif</text>
      <text x="139" y="48" fill="#10b981" font-size="20" font-weight="bold" font-family="sans-serif">18 Poli</text>

      <rect x="250" y="0" width="110" height="60" rx="8" fill="#0f243e" stroke="rgba(6, 182, 212, 0.2)"/>
      <text x="264" y="22" fill="#94a3b8" font-size="9" font-family="sans-serif">Status Server</text>
      <text x="264" y="48" fill="#06b6d4" font-size="14" font-weight="bold" font-family="sans-serif">ONLINE</text>

      <!-- Chart Simulation -->
      <rect x="0" y="75" width="360" height="160" rx="8" fill="#0a1a2e" stroke="rgba(6, 182, 212, 0.15)"/>
      <text x="16" y="98" fill="#e2e8f0" font-size="11" font-weight="bold" font-family="sans-serif">Monitoring Alur Pendaftaran Pasien</text>
      <path d="M 20 200 Q 80 150, 140 170 T 260 120 T 340 140" fill="none" stroke="#06b6d4" stroke-width="3"/>
      <path d="M 20 200 Q 80 150, 140 170 T 260 120 T 340 140 L 340 220 L 20 220 Z" fill="rgba(6, 182, 212, 0.1)"/>
    </g>
  </g>

  <!-- Left Float Badge -->
  <g transform="translate(60, 140)">
    <rect width="180" height="160" rx="16" fill="#030712" stroke="#06b6d4" stroke-width="2" opacity="0.95" filter="drop-shadow(0 15px 25px rgba(0,0,0,0.8))"/>
    <!-- Medical Cross -->
    <path d="M 90 35 L 90 75 M 70 55 L 110 55" stroke="#38bdf8" stroke-width="8" stroke-linecap="round"/>
    <text x="90" y="105" fill="#ffffff" font-size="15" font-weight="bold" font-family="sans-serif" text-anchor="middle">SIMRS RAWAT JALAN</text>
    <text x="90" y="125" fill="#38bdf8" font-size="11" font-family="monospace" text-anchor="middle">FINAL TASKS 2026</text>
    <rect x="35" y="135" width="110" height="4" rx="2" fill="url(#cyan-glow)"/>
  </g>
</svg>

